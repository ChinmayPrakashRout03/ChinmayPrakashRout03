name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate red contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ChinmayPrakashRout03
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=DC2626&color_dots=#161B22,#3F1515,#7F1D1D,#DC2626,#FF4D4D
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=FF4D4D&color_dots=#161B22,#3F1515,#7F1D1D,#DC2626,#FF4D4D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish red snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update red contribution snake"
